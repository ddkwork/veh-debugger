id: veh.tests.remote-transport
revision: 2
summary: Verify localhost TLS authentication, resident work reconnect and remote MCP routing with synthetic backends
use_when:
  - verifying changes to TCP transport, authentication or resident work ownership
tags: [veh-debugger, tests, mcp, remote, tcp, tls]
execution:
  kind: cli
  executable_ref: py
  cwd: .
  argv_template: [-3, -X, utf8, tools/run_tests.py, test_remote_transport.py, --jobs, "1", --timeout, "90"]
  trusted_for_run: true
  timeout_sec: 120
  artifact_mode: metadata
  preflight:
    - {id: windows.platform, kind: platform, ref: windows, requirement: required}
    - {id: python.version, kind: executable, ref: py, requirement: required, argv: [-3, --version]}
    - {id: remote.runner, kind: file, ref: build/bin/Release/veh-remote-runner.exe, requirement: required}
    - {id: remote.fixture, kind: file, ref: build/bin/Release/guest_backend_fixture.exe, requirement: required}
    - {id: remote.mcp, kind: file, ref: build/bin/Release/veh-mcp-server.exe, requirement: required}
    - {id: remote.target, kind: file, ref: build/bin/Release/test_target.exe, requirement: required}
    - {id: remote.dll, kind: file, ref: build/bin/Release/vcruntime_net.dll, requirement: required}
inputs: [test/test_remote_transport.py, test/mcp_test_client.py, src/remote/**, src/common/remote_channel.*, src/adapter/tcp_ipc_transport.*, build/bin/Release/**]
checks: [veh.remote.localhost]
docs: [docs/REMOTE_TRANSPORT.md, docs/DEVELOPMENT_TOOLS.md]
cache_policy: disabled
